name: FL public bar-derived firm roster source trial
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/law-fl-roster-probe.yml"
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          ref: recover-scrape-mcp
      - name: Respect robots policy and verify actual firm roster format and phone
        run: |
          python3 - <<'PY'
          import re,json
          from urllib.request import urlopen,Request
          from urllib import robotparser
          from law_local.worker import reader
          root="https://www.floridalawdirectory.com"
          ua="OpenLeads-Law-Evidence/1.0"
          robots=robotparser.RobotFileParser()
          try:
            with urlopen(Request(root+"/robots.txt",headers={"User-Agent":ua}),timeout=9) as rr:
              raw=rr.read(5500).decode("utf-8","replace")
              print(json.dumps({"robots_http":rr.status,"robots_excerpt":raw[:1700]}),flush=True)
          except Exception as ex:
            print(json.dumps({"robots_http_error":str(ex)[:200]}),flush=True)
          try:
            robots.set_url(root+"/robots.txt")
            robots.read()
            print(json.dumps({"robots_known":True,"robots_can_fetch_firm":robots.can_fetch(ua,root+"/firm/haas-law-pllc")}),flush=True)
          except Exception as e:
            print(json.dumps({"robots_error":str(e)[:120]}),flush=True)
          for sm in ("/sitemap.xml","/sitemap_index.xml"):
            try:
              with urlopen(Request(root+sm,headers={"User-Agent":ua}),timeout=12) as rr:
                body=rr.read(1000000).decode("utf-8","replace")
                from xml.etree import ElementTree as ET
                e=ET.fromstring(body)
                urls=[x.text for x in e.iter() if x.tag.endswith("loc")]
                print(json.dumps({"sitemap":sm,"status":rr.status,"bytes":len(body),
                    "url_count_first_mb":len(urls),
                    "firm_urls_first_mb":sum("/firm/" in (u or "") for u in urls),
                    "sitemap_urls":urls[:25]}),flush=True)
            except Exception as ex:
              print(json.dumps({"sitemap":sm,"error":str(ex)[:160]}),flush=True)
          ca_root="https://www.californialawdirectory.com"
          try:
            with urlopen(Request(ca_root+"/robots.txt",headers={"User-Agent":ua}),timeout=9) as rr:
              rt=rr.read(3000).decode("utf-8","replace")
              print(json.dumps({"ca_robots_http":rr.status,"ca_robots_excerpt":rt[:1000]}),flush=True)
            with urlopen(Request(ca_root+"/firms?page=2",headers={"User-Agent":ua}),timeout=12) as rr:
              page=rr.read(130000).decode("utf-8","replace")
              links=[(url,label) for url,label in reader(page).links if url.startswith("/firm/")]
              print(json.dumps({"ca_firms_http":rr.status,"ca_links":len(links),
                "ca_sample":links[:4]}),flush=True)
              if links:
                with urlopen(Request(ca_root+links[0][0],headers={"User-Agent":ua}),timeout=12) as pr:
                  body=pr.read(160000).decode("utf-8","replace")
                  txt=" ".join(reader(body).parts)
                  print(json.dumps({"ca_firm_profile_http":pr.status,"url":pr.url,
                   "count_text":(re.search(r"Attorneys.{0,80}?(\d+)\s+active",txt,re.I) or [None])[0],
                   "phone":(re.search(r"Phone.{0,40}\d{3}[- .)]{1,4}\d{3}[- .]\d{4}",txt,re.I) or [None])[0]}),flush=True)
          except Exception as ex:
            print(json.dumps({"ca_error":str(ex)[:220]}),flush=True)
          county="https://www.leebar.org"
          try:
            with urlopen(Request(county+"/robots.txt",headers={"User-Agent":ua}),timeout=10) as cr:
              print(json.dumps({"county_robots_http":cr.status,
                "county_robots_excerpt":cr.read(1200).decode("utf-8","replace")[:1100]}),flush=True)
            with urlopen(Request(county+"/membership/member-directory/",headers={"User-Agent":ua}),timeout=12) as cr:
              body=cr.read(280000).decode("utf-8","replace")
              from html import unescape
              parsed=reader(body)
              clean=" ".join(parsed.parts)
              print(json.dumps({"county_directory_status":cr.status,
                "county_html_bytes":len(body),
                "county_visible_firm":bool(re.search(r"ATLAS Defense Law|BLS Law",clean,re.I)),
                "county_phone":bool(re.search(r"239.?208.?1500",clean)),
                "county_emails_found":len(set(re.findall(r"[A-Z0-9._%+\-]+@[A-Z0-9.\-]+\.[A-Z]{2,}",body,re.I))),
                "county_website_field":bool(re.search("https://atlasdefenselaw.com",body)),
                "county_table_excerpt":clean[:650]}),flush=True)
          except Exception as ex:
            print(json.dumps({"county_error":str(ex)[:160]}),flush=True)
          for rp in ("/firms","/firms?page=2","/firms?size=2-10","/firms?sort=name"):
            try:
              with urlopen(Request(root+rp,headers={"User-Agent":ua}),timeout=12) as rr:
                doc=rr.read(250000).decode("utf-8","replace")
                p=reader(doc)
                firm_links=[(url,label) for url,label in p.links if url.startswith("/firm/")]
                print(json.dumps({"browse":rp,"status":rr.status,"final_url":rr.url,
                    "bytes":len(doc),"firm_link_count":len(firm_links),
                    "sample_links":firm_links[:5],"text_excerpt":" ".join(p.parts)[-400:]}),flush=True)
            except Exception as ex:
              print(json.dumps({"browse":rp,"error":str(ex)[:180]}),flush=True)
          try:
            u=root+"/firm/haas-law-pllc"
            with urlopen(Request(u,headers={"User-Agent":ua}),timeout=11) as rr:
              raw=rr.read(120000).decode("utf-8","replace")
              pp=reader(raw)
              idx=next((i for i,t in enumerate(pp.parts) if "Active attorneys" in t),-1)
              print(json.dumps({"roster_detail_url":u,
                "official_links":[(href,label[:45]) for href,label in pp.links if "floridabar.org" in href][:8],
                "roster_attorney_links":[(href,label[:50]) for href,label in pp.links if "/attorney/" in href][:8],
                "roster_mailto_links":[href for href,label in pp.links if href.startswith("mailto:")][:5],
                "roster_bar_context":" ".join(pp.parts[max(idx,0):max(idx,0)+30])[:850]}),flush=True)
          except Exception as ex:
            print(json.dumps({"roster_detail_error":str(ex)[:160]}),flush=True)
          fb_url="https://www.floridabar.org/directories/find-mbr/profile/?num=494674"
          try:
            with urlopen(Request(fb_url,headers={"User-Agent":ua}),timeout=12) as rr:
              h=rr.read(200000).decode("utf-8","replace")
              tx=" ".join(reader(h).parts)
              emails=sorted(set(re.findall(r"[A-Za-z0-9._%+\-]+@[A-Za-z0-9.\-]+\.[A-Za-z]{2,}",h)))
              print(json.dumps({"flbar_haas_http":rr.status,"bar_id":494674,
                "david_haas":bool(re.search("David.{0,15}Haas",tx,re.I)),
                "firm_match":bool(re.search("Haas Law",tx,re.I)),
                "published_email_count":len(emails),"emails":emails[:4],
                "office_phone":(re.search(r"\(?407\)?.{0,4}755.{0,4}7675",tx) or [None])[0],
                "source_excerpt":tx[:550]}),flush=True)
          except Exception as ex:
            print(json.dumps({"flbar_haas_error":str(ex)[:190]}),flush=True)
          for slug in ["haas-law-pllc","stearns-weaver-miller","office-of-regional-counsel","culmer-davidson","dubiner-wilensky-llc","harold-h-weisman-pa"]:
            url=root+"/firm/"+slug
            if robots.mtime() and not robots.can_fetch(ua,url):
              print(json.dumps({"slug":slug,"status":"robots_disallow"}),flush=True)
              continue
            try:
              with urlopen(Request(url,headers={"User-Agent":ua}),timeout=10) as r:
                h=r.read(160000).decode("utf-8","replace")
                t=" ".join(reader(h).parts)
                print(json.dumps({"slug":slug,"http":r.status,"final_url":r.url,
                  "bytes":len(h),"active_pattern":(re.search(r"Attorneys.{0,80}?\d{1,3}\s+active",t,re.I) or [None])[0],
                  "phone_pattern":(re.search(r"Phone.{0,45}?\(?\d{3}\)?[- .]\d{3}[- .]\d{4}",t,re.I) or [None])[0],
                  "heading":t[:185]}),flush=True)
            except Exception as e:
              print(json.dumps({"slug":slug,"error":str(e)[:140]}),flush=True)
          PY
