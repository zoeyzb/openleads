name: Law phone-first acquisition (bounded)
on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Law Google Maps public discovery pilot"]
    types: [completed]
  push:
    paths:
      - ".github/workflows/law-phone-acquisition.yml"
permissions:
  contents: read
  actions: read
concurrency:
  group: law-phone-acquisition
  cancel-in-progress: false
jobs:
  acquire:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: recover-scrape-mcp
          persist-credentials: false
      - name: Restore most recent completed checkpoint, including failed zero-yield runs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p state
          previous="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow law-phone-acquisition.yml --status completed --limit 1 --json databaseId --jq '.[0].databaseId // empty' 2>/dev/null || true)"
          if [ -n "$previous" ]; then
            gh run download "$previous" --repo "$GITHUB_REPOSITORY" --name law-phone-state --dir state || true
          fi
      - name: Check local Python regression suite
        run: python3 -m unittest discover -s law_local -v
      - name: Import public firm-and-phone candidates from the tracker and archive
        run: |
          python3 law_local/worker.py --db state/law-leads.sqlite3 import law_local/private_seed_firms_20261008.csv
      - name: Recheck previously rejected profiles after parser regression fixes
        run: |
          python3 - <<'PY'
          from law_local.worker import SqliteQueue
          db=SqliteQueue("state/law-leads.sqlite3")
          # Once-only migration marker: don't waste minutes rechecking on every run.
          db.conn.execute("CREATE TABLE IF NOT EXISTS verifier_migrations (name TEXT PRIMARY KEY)")
          name="20261008-directory-parse-and-site-redirect"
          if not db.conn.execute("SELECT 1 FROM verifier_migrations WHERE name=?",(name,)).fetchone():
              db.conn.execute("UPDATE candidates SET status='pending', attempts=0 WHERE status IN ('unverified_identity','unverified_size','inconclusive')")
              db.conn.execute("INSERT INTO verifier_migrations VALUES (?)",(name,))
              db.conn.commit()
          db.close()
          PY
      - name: Restore last real Google Maps no-site-field candidate artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p state/maps
          maps_run="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow law-maps-pilot.yml --status completed --limit 1 --json databaseId --jq '.[0].databaseId // empty' 2>/dev/null || true)"
          if [ -n "$maps_run" ]; then
            gh run download "$maps_run" --repo "$GITHUB_REPOSITORY" --name law-maps-discovery-pilot --dir state/maps || true
          fi
          # Scraper may have been cancelled AFTER writing partial results but
          # BEFORE its candidate extraction step. Recover the real raw CSV.
          if [ -f state/maps/results.csv ]; then
            python3 -m law_local.maps_extract --raw state/maps/results.csv \
              --out state/maps/no-site-phone-candidates.csv \
              --summary state/maps/extraction-summary.json
          fi
          if [ -f state/maps/no-site-phone-candidates.csv ]; then
            echo "MAPS_CANDIDATE_FILE_PRESENT=1"
          else
            echo "MAPS_CANDIDATE_FILE_PRESENT=0"
          fi
      - name: Verify source-bound attorney count; cool down empty real URL searches for 7 days
        run: |
          if [ -f state/maps/no-site-phone-candidates.csv ]; then
            python3 -m law_local.maps_first --db state/law-leads.sqlite3 --csv state/maps/no-site-phone-candidates.csv --seconds 160 --max-profiles 120
          else
            echo "No Maps artifact available. No Maps candidates may be inferred."
          fi
      - name: Diagnose website-review rejects from saved source evidence
        run: |
          python3 - <<'PY'
          import json
          from law_local.worker import SqliteQueue
          db=SqliteQueue("state/law-leads.sqlite3")
          rows=db.conn.execute("SELECT firm,source_url,result_json FROM candidates WHERE status='review_website' ORDER BY updated DESC LIMIT 15").fetchall()
          for row in rows:
              data=json.loads(row["result_json"] or "{}")
              print(json.dumps({"website_review": {"firm":row["firm"],"source_url":row["source_url"],
                                "website_candidates":data.get("website_candidates",[]),
                                "site_evidence":data.get("site_evidence",{})}}))
          db.close()
          PY
      - name: Reverify public directory evidence and owned websites
        run: |
          python3 law_local/worker.py --db state/law-leads.sqlite3 run \
            --max 340 --workers 8 --seconds 210
      - name: Export verified phone-first firms
        if: always()
        run: |
          if [ -f state/law-leads.sqlite3 ]; then
            python3 law_local/worker.py --db state/law-leads.sqlite3 export --status calling_qualified --out state/call-qualified-law.csv
            python3 law_local/worker.py --db state/law-leads.sqlite3 export --status strict_eligible --out state/email-eligible-law.csv
            python3 law_local/worker.py --db state/law-leads.sqlite3 stats | tee state/stats.json
          fi
      - name: Enforce nonzero production yield (CI green is not acquisition success)
        if: always()
        run: |
          python3 - <<'PY'
          import json,sys
          from pathlib import Path
          p=Path("state/stats.json")
          if not p.exists():
              print("ACQUISITION FAILED: no state/stats.json")
              sys.exit(1)
          data=json.loads(p.read_text())
          counts=data.get("counts",{})
          n=int(counts.get("calling_qualified",0))
          print(f"CALLING_QUALIFIED_TOTAL={n}")
          strict=int(counts.get("strict_eligible",0))
          print(f"VERIFIED_EMAIL_ELIGIBLE_TOTAL={strict}")
          if strict==0:
              print("ACQUISITION FAILED: 0 fully eligible leads with source-verified usable email; preserve phone-only leads as a separate calling list.")
              sys.exit(1)
          PY
      - name: Save private durable state and evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: law-phone-state
          path: |
            state/law-leads.sqlite3
            state/call-qualified-law.csv
            state/email-eligible-law.csv
            state/maps/no-site-phone-candidates.csv
            state/maps/extraction-summary.json
            state/stats.json
          if-no-files-found: warn
          retention-days: 14
