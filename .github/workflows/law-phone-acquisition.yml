name: Law phone-first acquisition (bounded)
on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Law Google Maps public discovery pilot"]
    types: [completed]
  push:
    paths:
      - ".github/workflows/law-phone-acquisition.yml"
permissions:
  contents: read
  actions: read
concurrency:
  group: law-phone-acquisition
  cancel-in-progress: false
jobs:
  acquire:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
        with:
          ref: recover-scrape-mcp
          persist-credentials: false
      - name: Restore most recent completed checkpoint, including failed zero-yield runs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p state
          previous="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow law-phone-acquisition.yml --status completed --limit 1 --json databaseId --jq '.[0].databaseId // empty' 2>/dev/null || true)"
          if [ -n "$previous" ]; then
            gh run download "$previous" --repo "$GITHUB_REPOSITORY" --name law-phone-state --dir state || true
          fi
      - name: Check local Python regression suite
        run: python3 -m unittest discover -s law_local -v
      - name: Import public firm-and-phone candidates from the tracker and archive
        run: |
          python3 law_local/worker.py --db state/law-leads.sqlite3 import law_local/private_seed_firms_20261008.csv
      - name: Recheck previously rejected profiles after parser regression fixes
        run: |
          python3 - <<'PY'
          from law_local.worker import SqliteQueue
          db=SqliteQueue("state/law-leads.sqlite3")
          # Once-only migration marker: don't waste minutes rechecking on every run.
          db.conn.execute("CREATE TABLE IF NOT EXISTS verifier_migrations (name TEXT PRIMARY KEY)")
          name="20261008-directory-parse-and-site-redirect"
          if not db.conn.execute("SELECT 1 FROM verifier_migrations WHERE name=?",(name,)).fetchone():
              db.conn.execute("UPDATE candidates SET status='pending', attempts=0 WHERE status IN ('unverified_identity','unverified_size','inconclusive')")
              db.conn.execute("INSERT INTO verifier_migrations VALUES (?)",(name,))
              db.conn.commit()
          db.close()
          PY
      - name: Restore last real Google Maps no-site-field candidate artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p state/maps
          maps_run="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow law-maps-pilot.yml --status completed --limit 1 --json databaseId --jq '.[0].databaseId // empty' 2>/dev/null || true)"
          if [ -n "$maps_run" ]; then
            gh run download "$maps_run" --repo "$GITHUB_REPOSITORY" --name law-maps-discovery-pilot --dir state/maps || true
          fi
          # Scraper may have been cancelled AFTER writing partial results but
          # BEFORE its candidate extraction step. Recover the real raw CSV.
          if [ -f state/maps/results.csv ]; then
            python3 -m law_local.maps_extract --raw state/maps/results.csv \
              --out state/maps/no-site-phone-candidates.csv \
              --summary state/maps/extraction-summary.json
          fi
          if [ -f state/maps/no-site-phone-candidates.csv ]; then
            echo "MAPS_CANDIDATE_FILE_PRESENT=1"
          else
            echo "MAPS_CANDIDATE_FILE_PRESENT=0"
          fi
      - name: Acquire FL bar-derived firm rosters with 2–10 active licensed attorneys and real published phone
        run: |
          python3 -m law_local.florida_roster --db state/law-leads.sqlite3 --max-pages 156 --max-profiles 1200 --seconds 560
      - name: Audit private-law-practice identity and source-backed contact counts
        run: |
          python3 - <<'PY'
          import sqlite3,json
          from law_local.florida_roster import clearly_non_law_employer,ambiguous_employer_identity
          db=sqlite3.connect('state/law-leads.sqlite3')
          rows=db.execute("SELECT firm,status,source_url FROM candidates WHERE source_url LIKE 'https://www.floridalawdirectory.com/firm/%'").fetchall()
          business=[x for x in rows if clearly_non_law_employer(x[0])]
          bad_identities=[x for x in rows if ambiguous_employer_identity(x[0])]
          for firm,status,url in business:
              if status in ('pending','inconclusive','unverified_identity','unverified_size'):
                  db.execute("UPDATE candidates SET status='review_nonlaw_employer' WHERE source_url=?",(url,))
          for firm,status,url in bad_identities:
              if status in ('pending','inconclusive','unverified_identity','unverified_size'):
                  db.execute("UPDATE candidates SET status='review_ambiguous_identity' WHERE source_url=?",(url,))
          db.commit()
          print(json.dumps({'source_backed_roster_records':len(rows),'nonlaw_employers_flagged':len(business),'ambiguous_identities_flagged':len(bad_identities)}))
          print(json.dumps({'source_backed_roster_records':len(rows),'nonlaw_employers_flagged':len(business),'remaining_roster_profiles':db.execute("SELECT COUNT(*) FROM fl_roster_frontier WHERE status='pending'").fetchone()[0]}))
          db.close()
          PY
      - name: Verify source-bound attorney count; cool down empty real URL searches for 7 days
        run: |
          if [ -f state/maps/no-site-phone-candidates.csv ]; then
            python3 -m law_local.maps_first --db state/law-leads.sqlite3 --csv state/maps/no-site-phone-candidates.csv --seconds 160 --max-profiles 120
          else
            echo "No Maps artifact available. No Maps candidates may be inferred."
          fi
      - name: Diagnose website-review rejects from saved source evidence
        run: |
          python3 - <<'PY'
          import json
          from law_local.worker import SqliteQueue
          db=SqliteQueue("state/law-leads.sqlite3")
          rows=db.conn.execute("SELECT firm,source_url,result_json FROM candidates WHERE status='review_website' ORDER BY updated DESC LIMIT 15").fetchall()
          for row in rows:
              data=json.loads(row["result_json"] or "{}")
              print(json.dumps({"website_review": {"firm":row["firm"],"source_url":row["source_url"],
                                "website_candidates":data.get("website_candidates",[]),
                                "site_evidence":data.get("site_evidence",{})}}))
          db.close()
          PY
      - name: Check official FL Bar publicly published email/owned-site evidence (12-firm pilot)
        run: |
          python3 -m law_local.fl_bar_contacts --db state/law-leads.sqlite3 --max-firms 12 --max-members 2 --seconds 100
      - name: Prove independent website search providers can find a known owned site
        run: python3 -m law_local.site_provider_health --ready-flag state/website-search-ready.flag
      - name: Reverify public directory evidence and owned websites only with healthy independent site searches
        run: |
          if [ -f state/website-search-ready.flag ]; then
            python3 law_local/worker.py --db state/law-leads.sqlite3 run \
              --max 220 --workers 8 --seconds 150
          else
            echo "WEBSITE_GATE_PAUSED: no two healthy, relevant search providers; preserving all source-backed firms for later no-site/email verification."
          fi
      - name: Preserve sourced 2–10 firm-size and business-phone candidates separately from email/no-site qualification
        if: always()
        run: |
          if [ -f state/law-leads.sqlite3 ]; then
            python3 - <<'PY'
          import sqlite3,csv,json
          from pathlib import Path
          db=sqlite3.connect("state/law-leads.sqlite3")
          db.row_factory=sqlite3.Row
          records=db.execute("""SELECT firm,phone,state,city,source_url,status,result_json
             FROM candidates WHERE source_url LIKE 'https://www.floridalawdirectory.com/firm/%'
               AND status NOT IN ('review_nonlaw_employer','review_ambiguous_identity')
             ORDER BY firm""").fetchall()
          path=Path("state/roster-sourced-size-phone.csv")
          path.parent.mkdir(parents=True,exist_ok=True)
          with path.open("w",newline="",encoding="utf-8") as f:
              w=csv.DictWriter(f,fieldnames=["Firm","Attorneys verified from roster","Phone",
                 "Email","City","State","Headcount source","Website/email status"])
              w.writeheader()
              for r in records:
                  ref=db.execute("SELECT listed_attorneys FROM fl_roster_frontier WHERE url=?",
                                 (r["source_url"],)).fetchone()
                  ev=json.loads(r["result_json"] or "{}")
                  w.writerow({"Firm":r["firm"],"Attorneys verified from roster":ref[0] if ref else "",
                    "Phone":r["phone"],"Email":ev.get("email",""),"City":r["city"],
                    "State":r["state"],"Headcount source":r["source_url"],
                    "Website/email status":r["status"] if r["status"]!="pending" else "pending_no_owned_site_email_audit"})
          print("BAR_ROSTER_SIZE_PHONE_RESEARCH_CANDIDATES="+str(len(records)))
          print("FULL_STRICT_VERIFIED_IN_ROSTER="+str(sum(r["status"]=="strict_eligible" for r in records)))
          db.close()
          PY
          fi
      - name: Export verified phone-first firms
        if: always()
        run: |
          if [ -f state/law-leads.sqlite3 ]; then
            python3 law_local/worker.py --db state/law-leads.sqlite3 export --status calling_qualified --out state/call-qualified-law.csv
            python3 law_local/worker.py --db state/law-leads.sqlite3 export --status strict_eligible --out state/email-eligible-law.csv
            python3 law_local/worker.py --db state/law-leads.sqlite3 stats | tee state/stats.json
          fi
      - name: Enforce nonzero production yield (CI green is not acquisition success)
        if: always()
        run: |
          python3 - <<'PY'
          import json,sys
          from pathlib import Path
          p=Path("state/stats.json")
          if not p.exists():
              print("ACQUISITION FAILED: no state/stats.json")
              sys.exit(1)
          data=json.loads(p.read_text())
          counts=data.get("counts",{})
          n=int(counts.get("calling_qualified",0))
          print(f"CALLING_QUALIFIED_TOTAL={n}")
          strict=int(counts.get("strict_eligible",0))
          print(f"VERIFIED_EMAIL_ELIGIBLE_TOTAL={strict}")
          if strict==0:
              print("ACQUISITION FAILED: 0 fully eligible leads with source-verified usable email; preserve phone-only leads as a separate calling list.")
              sys.exit(1)
          PY
      - name: Save private durable state and evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: law-phone-state
          path: |
            state/law-leads.sqlite3
            state/call-qualified-law.csv
            state/email-eligible-law.csv
            state/roster-sourced-size-phone.csv
            state/maps/no-site-phone-candidates.csv
            state/maps/extraction-summary.json
            state/stats.json
          if-no-files-found: warn
          retention-days: 90
