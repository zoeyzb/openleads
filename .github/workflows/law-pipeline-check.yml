name: Law pipeline check

on:
  pull_request:
    branches: [recover-scrape-mcp]
    paths:
      - "recover-mcp/law-firm-pipeline.mjs"
      - "recover-mcp/lawyercom-firm-size*.mjs"
      - "recover-mcp/enrich-deadline*.mjs"
      - "recover-mcp/law-lane-pressure*.mjs"
      - "recover-mcp/law-directory-runner*.mjs"
      - "recover-mcp/law-http-headers*.mjs"
      - "recover-mcp/indexed-target-headcount*.mjs"
      - "recover-mcp/google-serp-records*.mjs"
      - "recover-mcp/headcount-source-policy*.mjs"
      - "recover-mcp/strict-owned-website-gate*.mjs"
      - "recover-mcp/law-eligible-set-align*.mjs"
      - "recover-mcp/published-email-obfuscation*.mjs"
      - "recover-mcp/law-firm-targeting.mjs"
      - "recover-mcp/law-sheet-sync.mjs"
      - "recover-mcp/law-sheet-metrics*.mjs"
      - "recover-mcp/acquisition-worker*.mjs"
      - "package.json"
      - "Dockerfile"
      - ".github/workflows/law-pipeline-check.yml"
  push:
    branches: [recover-scrape-mcp]
    paths:
      - "recover-mcp/law-firm-pipeline.mjs"
      - "recover-mcp/law-firm-targeting.mjs"
      - "recover-mcp/law-sheet-sync.mjs"
      - "recover-mcp/acquisition-worker*.mjs"
      - "package.json"
      - "Dockerfile"

jobs:
  syntax:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify pinned email enrichment
        env:
          EMAIL_ENRICH_REF: 4c594a85118046362a76bb99736a46ed94ddc462
        run: |
          git init /tmp/email-enrich
          cd /tmp/email-enrich
          git remote add origin https://github.com/zoeyzb/email-enrich.git
          git fetch --depth 1 origin "$EMAIL_ENRICH_REF"
          git checkout --detach FETCH_HEAD
          npm install --no-audit --no-fund
          npm run typecheck
          npm test -- --runInBand
          npm run build
          cd "$GITHUB_WORKSPACE"
      - name: Run law email search plan regression test
        run: node recover-mcp/law-email-search-plan.node-test.mjs
      - name: Run published email obfuscation regression test
        run: node recover-mcp/published-email-obfuscation.node-test.mjs
      - name: Run eligible set alignment regression test
        run: node recover-mcp/law-eligible-set-align.node-test.mjs
      - name: Run Lawyer.com firm-size scope regression test
        run: node recover-mcp/lawyercom-firm-size.node-test.mjs
      - name: Run headcount source policy regression test
        run: node recover-mcp/headcount-source-policy.node-test.mjs
      - name: Run strict owned-website gate regression test
        run: node recover-mcp/strict-owned-website-gate.node-test.mjs
      - name: Run enrichment deadline regression test
        run: node recover-mcp/enrich-deadline.node-test.mjs
      - name: Run law lane-pressure regression test
        run: node recover-mcp/law-lane-pressure.node-test.mjs
      - name: Run law directory runner regression test
        run: node recover-mcp/law-directory-runner.node-test.mjs
      - name: Run legal-directory HTTP header regression test
        run: node recover-mcp/law-http-headers.node-test.mjs
      - name: Run indexed target headcount regression test
        run: node recover-mcp/indexed-target-headcount.node-test.mjs
      - name: Run Google SERP record regression test
        run: node recover-mcp/google-serp-records.node-test.mjs
      - name: Check law pipeline syntax
        run: node --check recover-mcp/law-firm-pipeline.mjs
      - name: Run law targeting regression test
        run: node recover-mcp/law-firm-targeting.node-test.mjs
      - name: Run law sheet metrics regression test
        run: node recover-mcp/law-sheet-metrics.node-test.mjs
      - name: Check law sheet sync syntax
        run: node --check recover-mcp/law-sheet-sync.mjs
      - name: Check acquisition worker syntax
        run: |
          node --check recover-mcp/acquisition-worker.mjs
          node --check recover-mcp/acquisition-worker-runtime.mjs
          node --check recover-mcp/acquisition-persistence.mjs
          node --check recover-mcp/acquisition-coverage.mjs
