name: Law Google Maps public discovery pilot
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/law-maps-pilot.yml"
permissions:
  contents: read
jobs:
  map-pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: recover-scrape-mcp
          persist-credentials: false
      - name: Run bounded multi-state public Maps queries (no hosted infrastructure)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p law-maps-out
          cat > law-maps-queries.txt <<'EOF'
          law firm in Amarillo Texas
          law office in Waco Texas
          attorney office in Tyler Texas
          law firm in Ocala Florida
          law office in Gainesville Florida
          law firm in Springfield Illinois
          law office in Macon Georgia
          law firm in Akron Ohio
          law office in Florence South Carolina
          law firm in Tupelo Mississippi
          law office in Jonesboro Arkansas
          estate planning law office in Evansville Indiana
          family law firm in Altoona Pennsylvania
          law office in Dover Delaware
          law firm in Rochester Minnesota
          criminal defense law office in Pueblo Colorado
          law office in San Angelo Texas
          law firm in Flagstaff Arizona
          law office in Fort Smith Arkansas
          law firm in Morgantown West Virginia
          EOF
          # One pilot only. The upstream image is the existing MIT-licensed
          # gosom scraper; bound container execution to protect CI usage.
          timeout --signal=TERM --kill-after=12s 330s docker run --rm \
            -v "$PWD/law-maps-queries.txt:/queries.txt:ro" \
            -v "$PWD/law-maps-out:/out" \
            gosom/google-maps-scraper \
            -input /queries.txt -results /out/results.csv \
            -depth 1 -c 2 -exit-on-inactivity 2m || code=$?
          if [ "${code:-0}" != "0" ]; then
            echo "Maps collector stopped with status ${code}; inspecting any partial output"
          fi
      - name: Recover partial raw Maps results into unverified candidates
        if: always()
        run: |
          python3 -m law_local.maps_extract --raw law-maps-out/results.csv \
            --out law-maps-out/no-site-phone-candidates.csv \
            --summary law-maps-out/summary.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: law-maps-discovery-pilot
          path: law-maps-out/
          retention-days: 14
          if-no-files-found: warn
